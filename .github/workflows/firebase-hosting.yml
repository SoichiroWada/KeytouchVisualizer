name: Firebase Hosting (manual, approval required)

# No push/PR deployment trigger. Enable the repository variable only after
# owner approval and configure the protected production environment first.
on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: '本番公開を承認する場合は keytouch-visualizer と入力'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_FIREBASE_PRODUCTION_DEPLOY == 'true' && inputs.confirm_project == 'keytouch-visualizer' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEYTOUCH_VISUALIZER }}
          projectId: keytouch-visualizer
          channelId: live
